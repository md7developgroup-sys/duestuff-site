<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'ru' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
{% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://duestuff.com{{ page.url }}">
<!--
  Вёрстка своя и намеренно.

  Штатная тема jekyll-theme-minimal рисует поверх страницы кнопку «View the Project
  on GitHub», подпись «This project is maintained by …» и «Hosted on GitHub Pages».
  На витрине это шум, а на политике конфиденциальности — прямая ссылка с юридического
  документа на инфраструктуру разработчика. Ни один из этих элементов не написан нами
  и ни один не нужен читателю.

  Внешних ресурсов здесь нет: ни шрифтов, ни аналитики, ни CDN. Страница о приватности,
  которая тянет чужой скрипт, противоречит собственному тексту.
-->
<style>
  :root {
    --bg: #f4f3fb;
    --card: #ffffff;
    --ink: #1c1b22;
    --muted: #5c5b66;
    --line: #e3e1ef;
    --accent: #3b5bf6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14131a;
      --card: #1d1c25;
      --ink: #ecebf2;
      --muted: #a09eae;
      --line: #2e2c3a;
      --accent: #8ea2ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2.5rem 1.25rem 4rem;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 44rem;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 2.5rem 2rem;
  }
  h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 1.5rem; letter-spacing: -0.01em; }
  h2 { font-size: 1.2rem; margin: 2.25rem 0 0.75rem; letter-spacing: -0.005em; }
  p, li { color: var(--ink); }
  a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  ul { padding-left: 1.25rem; }
  li { margin: 0.35rem 0; }
  strong { font-weight: 600; }
  code { font-size: 0.9em; background: var(--bg); padding: 0.1em 0.35em; border-radius: 4px; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 2.5rem 0; }
  /* Таблицы «куда данные попадают» и «разрешения»: на телефоне прокручиваются
     внутри себя, а не растягивают страницу вбок. */
  .scroll { overflow-x: auto; margin: 1rem 0; }
  table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
  th, td { text-align: left; padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; color: var(--muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; }
  footer {
    max-width: 44rem;
    margin: 1.5rem auto 0;
    padding: 0 0.5rem;
    color: var(--muted);
    font-size: 0.875rem;
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
{{ content }}
</main>
<footer>
  <p>DueStuff · <a href="/">о приложении</a> · <a href="/privacy/">политика конфиденциальности</a> · <a href="/privacy/en/">privacy policy</a> · <a href="/delete-account/">удалить аккаунт</a> · <a href="mailto:support@duestuff.com">support@duestuff.com</a></p>
</footer>
<script>
  // Единственный скрипт на сайте: оборачивает таблицы в прокручиваемый блок,
  // потому что Markdown-таблицу иначе не обернуть. Ничего не отправляет и ничего
  // не читает — работает с уже отрисованной страницей.
  document.querySelectorAll('table').forEach(function (t) {
    var box = document.createElement('div');
    box.className = 'scroll';
    t.parentNode.insertBefore(box, t);
    box.appendChild(t);
  });
</script>
</body>
</html>
